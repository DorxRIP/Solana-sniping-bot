# Pump Sniper

A Rust + egui bot that watches pump.fun for newly created tokens and can
buy/sell them automatically, with a small local GUI. Starts in **dry-run**
mode by default - it detects and logs decisions but never sends a real
transaction until you turn that off.

## 1. One-time setup

1. **Install Rust** (if you don't have it): https://rustup.rs - just follow
   the one-line installer for your OS.
2. **Get an RPC endpoint.** Sign up free at https://helius.dev, create a
   project, and copy your HTTPS and WebSocket URLs (they'll include an API
   key). The free tier is enough for dry-run testing.
3. **Export your bot wallet's private key from Phantom.** Use a dedicated
   account/wallet, not your main one. Phantom: Settings → select the
   account → Export Private Key. Copy the base58 string it gives you.
4. Copy `.env.example` to `.env` and paste that key in:
   ```
   cp .env.example .env
   ```
   `.env` is git-ignored - it never leaves your machine.
5. Run it once to generate `config.toml`:
   ```
   cargo run --release
   ```
   Then edit `config.toml` (or use the Settings tab in the GUI) and set
   `rpc_http_url` / `rpc_ws_url` to your Helius URLs.

## 2. Recommended testing order

1. Leave `dry_run = true` (the default). Hit **Start**. Watch the "Active
   Coins" and "Log" tabs to see it detecting real pump.fun launches and
   deciding whether it would have bought each one.
2. Once the behavior looks right, set your `buy_amount_sol` and
   `max_total_sol_cap` very low (e.g. 0.01-0.02 SOL total), flip
   `dry_run = false`, and try one real cycle so you can confirm the whole
   path - detect → buy → sell - works end to end with your RPC and wallet.
3. Scale up only once you're comfortable.

## 3. What I verified directly (not just from docs)

I pulled the actual source of the `pumpfun` crate (v4.6.0) from crates.io and
read through it - here's what that confirmed:

**Fund safety.** Every instruction it builds for `buy`/`sell` only moves SOL
between *your own wallet*, *your own token account*, and pump.fun's own
protocol accounts (bonding curve, creator vault, fee config) - I cross-checked
every hardcoded address (program ID, fee accounts, token program, etc.)
against multiple independent public sources and they all match pump.fun's
real, documented accounts. There's no `unsafe` code, no `build.rs`, no
shell/process execution, and the only network call outside of Solana RPC is
a call to pump.fun's own `https://pump.fun/api/ipfs` for metadata uploads
when *creating* a token - a path this bot never uses, since it only buys and
sells existing tokens. Your private key is only ever used locally to sign;
it's never transmitted anywhere.

**API details that were previously "verify locally" caveats - now confirmed
correct:** the `Cluster::new(http, ws, commitment, priority_fee)` constructor
exists (so `main.rs` now points the pump.fun client straight at your Helius
URL, not a public default), `BondingCurveAccount.creator` and
`.token_total_supply` are exactly the field names used, and `client.buy(...)`
/ `client.sell(...)` take exactly the arguments this bot passes them. All
fixed/updated in the code.

**One real limitation I found and fixed:** pump.fun has had a second token
type in play since late 2025 - tokens created via `create_v2`, which are
minted with Solana's newer Token-2022 program instead of the original SPL
Token program. The `pumpfun` crate only supports the original SPL Token
type. I added a check (`risk::is_legacy_spl_token`) that detects and skips
Token-2022 tokens before doing anything else with them - previously this bot
would have silently miscalculated the dev-holder check on those (reading the
wrong account and reporting "0% held" regardless of the truth). Token-2022
tokens are now skipped with a clear reason logged instead. I don't have a
reliable way to tell you what fraction of current pump.fun launches use
`create_v2` vs. the original - it may be a small or large share by the time
you're running this - so expect the "skipped: Token-2022" reason to show up
sometimes in the Active Coins tab; that's this working as intended, not a bug.

## 4. Why I still can't compile it myself

I tried harder this time: I pulled in a real toolchain via apt (only Rust
1.75 is available there) and also tried pinning individual dependency
versions to route around the failure. It's not fixable that way - `solana-sdk`
2.3.1 itself (via `blake3` → `digest` → `block-buffer`) requires a Cargo
release with the `edition2024` manifest feature, which needs Rust 1.85+
(Feb 2025). That's a full toolchain requirement, not a specific package I
can swap out, and I don't have network access in this sandbox to install a
newer Rust. This isn't a bleeding-edge requirement on your end though -
Rust 1.85 is over a year old at this point, and `rustup` (step 1 above)
will give you something much newer by default.

So `cargo build --release` on your machine is still the real first compile.
Given how much I was able to confirm directly against the crate's source
above, I'd expect it to build cleanly, but I can't promise that with 100%
certainty without having compiled it myself - if anything comes up, send me
the error and I'll fix it.

## 5. What each setting does

| Setting | Checklist item |
|---|---|
| `buy_amount_sol` | SOL spent per buy |
| `max_total_sol_cap` | bot stops opening new positions once total spend hits this |
| `slippage_bps` (shown as % in the GUI) | max acceptable slippage, enforced on-chain |
| `take_profit_pct` / `stop_loss_pct` | exit rules, 0-100% |
| `max_dev_holder_pct` | skip the buy if the creator holds more than this % of supply |
| `max_hold_enabled` / `max_hold_seconds` | optional forced exit after N seconds |
| `dry_run` | master safety switch - off by default is *on* (safe) |

## 6. Security notes

- Your private key lives only in `.env` (or wherever `wallet_key_path`
  points) and is read once at startup - never logged, never sent anywhere
  except to sign transactions locally.
- Use a wallet dedicated to this bot, funded only with what you're willing
  to actively trade.
- `config.toml` and `pumpsniper_data.json` (trade history) are git-ignored
  by default since they can contain your RPC API key and trading activity.
