use crate::config::Config;
use anyhow::{bail, Context};
use solana_sdk::signature::{Keypair, Signer};
use std::sync::Arc;

/// Loads the trading keypair from (in priority order):
///   1. the PUMPSNIPER_PRIVATE_KEY environment variable, or
///   2. a local file whose path is set in config.wallet_key_path
///
/// The key is expected in base58 format - exactly what Phantom gives you
/// when you use "Export Private Key" on an account. The raw string is never
/// logged, printed, or sent anywhere; it only ever lives in memory long
/// enough to build the Keypair.
///
/// SECURITY: use a wallet/account dedicated to this bot, funded only with
/// what you're willing to actively trade - not your main holdings.
pub fn load_keypair(cfg: &Config) -> anyhow::Result<Arc<Keypair>> {
    // dotenvy loads a local .env file into the process environment, if present.
    let _ = dotenvy::dotenv();

    let secret = if let Ok(env_val) = std::env::var("PUMPSNIPER_PRIVATE_KEY") {
        env_val
    } else if let Some(path) = &cfg.wallet_key_path {
        std::fs::read_to_string(path)
            .with_context(|| format!("could not read wallet key file at {path}"))?
    } else {
        bail!(
            "No wallet key found. Set the PUMPSNIPER_PRIVATE_KEY environment \
             variable (e.g. in a local .env file, never committed to git), or \
             set wallet_key_path in config.toml to point at a local key file."
        );
    };

    let trimmed = secret.trim();
    let keypair = Keypair::from_base58_string(trimmed);

    // Sanity check without ever printing the secret itself.
    println!("Loaded wallet: {}", keypair.pubkey());

    Ok(Arc::new(keypair))
}
