[package]
name = "pump_scanner"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.23", features = ["native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
url = "2"
chrono = "0.4"
dotenv = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
bs58 = "0.5"
solana-sdk = { version = "1.18.26", features = ["full"], default-features = false }
base64 = "0.22"
bincode = "1.3"
